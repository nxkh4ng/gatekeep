version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    # Correctness
    - asasalint
    - copyloopvar
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - forcetypeassert
    - makezero
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - predeclared
    - reassign
    - recvcheck
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    # Modern Go
    - exptostd
    - intrange
    - modernize
    # Security
    - bidichk
    - depguard
    - forbidigo
    - gosec
    # Hygiene
    - asciicheck
    - dupword
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocognit
    - gocritic
    - misspell
    - nolintlint
    - thelper
    - usetesting

  settings:
    depguard:
      rules:
        weak-crypto:
          deny:
            - pkg: crypto/md5
              desc: MD5 is broken; use SHA-256 or a password KDF.
            - pkg: crypto/sha1
              desc: SHA-1 is broken; use SHA-256.
            - pkg: crypto/des
              desc: DES is obsolete; use AES-GCM.
            - pkg: crypto/rc4
              desc: RC4 is broken; use AES-GCM.
            - pkg: math/rand
              desc: math/rand is predictable; use crypto/rand.
            - pkg: unsafe
              desc: unsafe bypasses Go memory safety; requires explicit review.
    errcheck:
      check-type-assertions: true
      check-blank: false
    forbidigo:
      forbid:
        - pattern: ^fmt\.(Print|Printf|Println|Fprint|Fprintf|Fprintln)$
          msg: core must not write to process output; return values so cmd can render them.
        - pattern: ^(log|slog)\.
          msg: core must not log; entries and key material must not leave the vault.
        - pattern: ^os\.(Stdout|Stderr)$
          msg: core must not write to process output; return values so cmd can render them.
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 25
    gocritic:
      enabled-tags:
        - diagnostic
    gosec:
      config:
        G301: "0700"
        G302: "0600"
        G306: "0600"
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test fixtures may use non-sentinel error variables and absolute paths.
      - path: _test\.go
        linters:
          - errname
      - path: _test\.go
        text: filepathJoin
        linters:
          - gocritic
      # Only core is held to the "never print or log" rule.
      - path: ^(cmd/|main\.go$)
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

formatters:
  enable:
    - gofumpt
    - goimports
